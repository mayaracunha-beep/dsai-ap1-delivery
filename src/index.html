<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeliveryFast</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

  
  <header class="bg-red-600 text-white shadow-md">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold flex items-center gap-2 cursor-pointer" onclick="voltarParaRestaurantes()">
        🍔 DeliveryFast
      </h1>

      
      <nav class="flex items-center gap-6 font-semibold">
        <a href="#" id="btn-inicio" onclick="voltarParaRestaurantes()" class="hover:underline hidden">Início</a>
        <a href="#" onclick="verPedidos()" class="hover:underline">Pedidos</a>
        
       
        <div class="flex items-center gap-1 bg-red-700 px-3 py-1 rounded-full text-sm font-bold">
          <span>🛒</span>
          <span id="cart-count">0</span>
        </div>
      </nav>
    </div>
  </header>

  <main class="container mx-auto p-6">
    <div id="app"></div>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
